<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - QuantAnalysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; }
        .forgot-card { max-width: 400px; width: 100%; margin: 0 auto; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="card forgot-card shadow">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">忘记密码</h4>
            <div id="alert" class="alert d-none" role="alert"></div>
            <form id="forgot-form">
                <div class="mb-3">
                    <label class="form-label" for="email">注册邮箱</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus>
                    <div class="form-text">系统将向该邮箱发送密码重置链接。</div>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="submit-btn">发送重置链接</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none small">返回登录</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert');
            alertBox.classList.add('d-none');
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            try {
                const resp = await axios.post('/api/auth/forgot-password', {
                    email: document.getElementById('email').value.trim(),
                });
                alertBox.textContent = resp.data.message;
                alertBox.className = 'alert alert-success';
            } catch (err) {
                alertBox.textContent = (err.response && err.response.data && err.response.data.message) || '发送失败，请稍后重试';
                alertBox.className = 'alert alert-danger';
            } finally {
                alertBox.classList.remove('d-none');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
