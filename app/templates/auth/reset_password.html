<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - QuantAnalysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; }
        .reset-card { max-width: 400px; width: 100%; margin: 0 auto; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="card reset-card shadow">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-4">重置密码</h4>
            <div id="alert" class="alert d-none" role="alert"></div>
            <form id="reset-form">
                <input type="hidden" id="token" value="{{ token }}">
                <div class="mb-3">
                    <label class="form-label" for="new-password">新密码</label>
                    <input type="password" class="form-control" id="new-password" name="new_password" required minlength="6" autofocus>
                    <div class="form-text">至少 6 位。</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirm-password">确认新密码</label>
                    <input type="password" class="form-control" id="confirm-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="submit-btn">重置密码</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none small">返回登录</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert');
            alertBox.classList.add('d-none');
            const newPassword = document.getElementById('new-password').value;
            if (newPassword !== document.getElementById('confirm-password').value) {
                alertBox.textContent = '两次输入的密码不一致';
                alertBox.className = 'alert alert-danger';
                alertBox.classList.remove('d-none');
                return;
            }
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            try {
                const resp = await axios.post('/api/auth/reset-password', {
                    token: document.getElementById('token').value,
                    new_password: newPassword,
                });
                alertBox.textContent = resp.data.message + '，即将跳转到登录页…';
                alertBox.className = 'alert alert-success';
                alertBox.classList.remove('d-none');
                setTimeout(() => { location.href = '/login'; }, 1500);
            } catch (err) {
                alertBox.textContent = (err.response && err.response.data && err.response.data.message) || '重置失败，请稍后重试';
                alertBox.className = 'alert alert-danger';
                alertBox.classList.remove('d-none');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
