<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - QuantAnalysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 400px; width: 100%; margin: 0 auto; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="card login-card shadow">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-1">QuantAnalysis</h4>
            <p class="text-muted text-center mb-4">量化分析系统</p>
            <div id="alert" class="alert alert-danger d-none" role="alert"></div>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label" for="username">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="submit-btn">登录</button>
            </form>
            <div class="text-center mt-3">
                <a href="/forgot-password" class="text-decoration-none small">忘记密码？</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert');
            alertBox.classList.add('d-none');
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            try {
                const resp = await axios.post('/api/auth/login', {
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value,
                });
                if (resp.data.data.must_change_password) {
                    location.href = '/change-password';
                } else {
                    const params = new URLSearchParams(location.search);
                    location.href = params.get('next') || '/';
                }
            } catch (err) {
                alertBox.textContent = (err.response && err.response.data && err.response.data.message) || '登录失败，请稍后重试';
                alertBox.classList.remove('d-none');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
