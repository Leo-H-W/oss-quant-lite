{% extends "base.html" %}
{% block title %}修改密码 - QuantAnalysis{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title mb-1">修改密码</h4>
                    {% if g.user and g.user.must_change_password %}
                    <div class="alert alert-warning mt-3 mb-3">
                        首次登录（或密码已被管理员重置），请先修改密码后再继续使用系统。
                    </div>
                    {% endif %}
                    <div id="alert" class="alert d-none mt-3" role="alert"></div>
                    <form id="change-form" class="mt-3">
                        <div class="mb-3">
                            <label class="form-label" for="old-password">原密码</label>
                            <input type="password" class="form-control" id="old-password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="new-password">新密码</label>
                            <input type="password" class="form-control" id="new-password" required minlength="6">
                            <div class="form-text">至少 6 位，且不能与原密码相同。</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirm-password">确认新密码</label>
                            <input type="password" class="form-control" id="confirm-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="submit-btn">确认修改</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    document.getElementById('change-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const alertBox = document.getElementById('alert');
        alertBox.classList.add('d-none');
        const newPassword = document.getElementById('new-password').value;
        if (newPassword !== document.getElementById('confirm-password').value) {
            alertBox.textContent = '两次输入的密码不一致';
            alertBox.className = 'alert alert-danger';
            alertBox.classList.remove('d-none');
            return;
        }
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        try {
            const resp = await apiRequest('/auth/change-password', {
                method: 'POST',
                data: {
                    old_password: document.getElementById('old-password').value,
                    new_password: newPassword,
                },
            });
            alertBox.textContent = resp.message + '，即将跳转到首页…';
            alertBox.className = 'alert alert-success';
            alertBox.classList.remove('d-none');
            setTimeout(() => { location.href = '/'; }, 1500);
        } catch (err) {
            alertBox.textContent = (err.response && err.response.data && err.response.data.message) || '修改失败，请稍后重试';
            alertBox.className = 'alert alert-danger';
            alertBox.classList.remove('d-none');
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
