services:
  web:
    build: .
    environment:
      - DATA_DIR=/app/data
      - SQLITE_DATABASE_PATH=/app/instance/stock_cursor.sqlite3
      - FLASK_ENV=production
      - SOCKETIO_ASYNC_MODE=eventlet
      - PORT=9090
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    env_file:
      - .env
    ports:
      - "9090:9090"
    volumes:
      - ./data:/app/data
      - ./instance:/app/instance
      - ./logs:/app/logs
    restart: unless-stopped
